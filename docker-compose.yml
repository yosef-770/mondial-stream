      STREAM_HEADERS_FILE: ${STREAM_20_HEADERS_FILE:-}
      STREAM_HTTP_PROXY: ${STREAM_20_HTTP_PROXY:-${STREAM_HTTP_PROXY:-}}

  stream-control:
    image: python:3.12-alpine
    container_name: mondial-stream-control
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/project:ro
    working_dir: /project
    command: ["python3", "/project/scripts/stream-control-server.py"]

  freeswitch:
    image: safarov/freeswitch:latest
    container_name: mondial-freeswitch
    restart: unless-stopped
    depends_on:
      - icecast
      - stream-control
    network_mode: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ./freeswitch/dialplan/public/00_mondial.xml:/usr/share/freeswitch/conf/vanilla/dialplan/public/00_mondial.xml:ro
      - ./freeswitch/scripts/streamctl.lua:/usr/share/freeswitch/conf/vanilla/scripts/streamctl.lua:ro
      - ./freeswitch/scripts/live-stream.lua:/usr/share/freeswitch/conf/vanilla/scripts/live-stream.lua:ro
      - ./freeswitch/sounds/he/streamctl:/usr/share/freeswitch/sounds/he/streamctl:ro
      - ./freeswitch/sounds/he/live:/usr/share/freeswitch/sounds/he/live:ro
      - ./freeswitch/autoload_configs/modules.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/modules.conf.xml:ro
      - ./freeswitch/autoload_configs/event_socket.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/event_socket.conf.xml:ro
      - ./freeswitch/autoload_configs/conference.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/conference.conf.xml:ro
      - ./freeswitch/autoload_configs/acl.conf.xml:/usr/share/freeswitch/conf/vanilla/autoload_configs/acl.conf.xml:ro
      - ./freeswitch/vars.xml:/usr/share/freeswitch/conf/vanilla/vars.xml:ro
      - ./freeswitch/sip_profiles/external.xml:/usr/share/freeswitch/conf/vanilla/sip_profiles/external.xml:ro
      - ./scripts/freeswitch-entrypoint.sh:/freeswitch-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/freeswitch-entrypoint.sh"]
    environment:
      - TZ=Asia/Jerusalem

networks:
  mondial-net:
    driver: bridge
