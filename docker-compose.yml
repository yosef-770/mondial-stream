x-stream-relay: &stream-relay
  build:
    context: .
    dockerfile: docker/stream-relay.Dockerfile
  image: mondial-stream-relay:local
  restart: unless-stopped
  depends_on:
    - icecast
  env_file:
    - .env
  volumes:
    - ./scripts/stream-relay.sh:/stream-relay.sh:ro
    - ./scripts/kan11-headers.txt:/kan11-headers.txt:ro
  entrypoint: ["/bin/sh", "/stream-relay.sh"]
  networks:
    - mondial-net

services:
  icecast:
    image: moul/icecast
    container_name: mondial-icecast
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./icecast/icecast.xml:/etc/icecast2/icecast.xml:ro
    networks:
      - mondial-net

  stream-relay-1:
    <<: *stream-relay
    container_name: mondial-stream-relay-1
    environment:
      ICECAST_HOST: icecast
      ICECAST_MOUNT: /1
      STREAM_URL: ${STREAM_1_URL:-}
      STREAM_URLS: ${STREAM_1_URLS:-}
      STREAM_HEADERS_FILE: ${STREAM_1_HEADERS_FILE:-}
      STREAM_HTTP_PROXY: ${STREAM_1_HTTP_PROXY:-${STREAM_HTTP_PROXY:-}}

  stream-relay-2:
    <<: *stream-relay
    container_name: mondial-stream-relay-2
